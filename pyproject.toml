[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "creative-music-generator"
version = "0.1.0"
description = "Algorithmic composition system using fractal melodies, harmony engines, and genetic algorithms"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "midiutil>=1.2.1",
    "scipy>=1.10.0",
    "networkx>=3.1",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "flake8", "black"]
